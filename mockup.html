<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Brandtrack Help Center — Mockup</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Space Grotesk', sans-serif;
      background: #000;
      color: #fff;
    }

    /* ── MAIN LAYOUT — full viewport ── */
    .main {
      display: grid;
      grid-template-columns: 400px 1fr;
      height: 100vh;
    }

    /* ── LEFT PANEL ── */
    .left-panel {
      background: linear-gradient(160deg, #2d1a6b 0%, #1a0e3e 50%, #000 100%);
      padding: 56px 44px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      border-right: 1px solid rgba(255,255,255,0.06);
      overflow-y: auto;
    }

    .left-panel h1 {
      font-size: 44px;
      font-weight: 800;
      line-height: 1.1;
      color: #fff;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      padding: 14px 20px;
      transition: border-color 0.2s;
    }
    .search-box:focus-within {
      border-color: rgba(116,85,253,0.6);
    }
    .search-box svg { flex-shrink: 0; color: rgba(255,255,255,0.4); }
    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      flex: 1;
    }
    .search-box input::placeholder { color: rgba(255,255,255,0.35); }

    .popular-label {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .popular-tags {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .tag {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 14px;
      color: rgba(255,255,255,0.8);
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: block;
    }
    .tag:hover {
      background: rgba(116,85,253,0.15);
      border-color: rgba(116,85,253,0.4);
      color: #fff;
    }

    /* ── RIGHT PANEL ── */
    .right-panel {
      padding: 40px 44px;
      background: #000;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .categories-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 14px;
      flex: 1;
    }

    .category-card {
      background: #0a0a0a;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 14px;
      cursor: pointer;
      text-decoration: none;
      color: #fff;
      transition: all 0.25s ease;
    }
    .category-card:hover {
      background: #0f0f0f;
      border-color: rgba(116,85,253,0.5);
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(116,85,253,0.12);
    }
    .category-card svg {
      width: 38px;
      height: 38px;
      color: rgba(255,255,255,0.7);
      transition: color 0.2s;
    }
    .category-card:hover svg { color: #7455FD; }
    .category-card span {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      color: #fff;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      .main { grid-template-columns: 1fr; height: auto; }
      .left-panel { padding: 40px 24px; }
      .right-panel { padding: 32px 24px; }
      .categories-grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: auto; }
    }
    @media (max-width: 480px) {
      .categories-grid { grid-template-columns: 1fr; }
      .left-panel h1 { font-size: 34px; }
    }
  </style>
</head>
<body>

  <div class="main">

    <!-- LEFT -->
    <aside class="left-panel">
      <h1>¿Cómo podemos ayudarte?</h1>

      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="7.5" cy="7.5" r="5.5"/>
          <path d="M16 16l-3.5-3.5"/>
        </svg>
        <input type="text" placeholder="Buscar..." autocomplete="on"/>
      </div>

      <p class="popular-label">Temas frecuentes</p>

      <div class="popular-tags">
        <a href="#" class="tag">¿Cómo registrarme en Brandtrack?</a>
        <a href="#" class="tag">¿Cómo elegir una playlist según el tipo de negocio?</a>
        <a href="#" class="tag">¿Qué es un schedule?</a>
      </div>
    </aside>

    <!-- RIGHT -->
    <main class="right-panel">
      <div class="categories-grid">

        <a href="#" class="category-card">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
          </svg>
          <span>Primeros pasos</span>
        </a>

        <a href="#" class="category-card">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          <span>Manejo de cuenta</span>
        </a>

        <a href="#" class="category-card">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/>
          </svg>
          <span>App</span>
        </a>

        <a href="#" class="category-card">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
          </svg>
          <span>Brandtrack Box</span>
        </a>

        <a href="#" class="category-card">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
          </svg>
          <span>Música</span>
        </a>

        <a href="#" class="category-card">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
          </svg>
          <span>Anuncios</span>
        </a>

        <a href="#" class="category-card">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="15" rx="2"/><path d="M16 2l-4 5-4-5"/>
          </svg>
          <span>Digital Signage</span>
        </a>

        <a href="#" class="category-card">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/>
          </svg>
          <span>Requerimientos técnicos</span>
        </a>

        <a href="#" class="category-card">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="4" width="22" height="16" rx="2"/><path d="M1 10h22"/>
          </svg>
          <span>Método de pago y planes</span>
        </a>

      </div>
    </main>

  </div>

</body>
</html>
